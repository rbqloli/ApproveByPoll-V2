services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/rbqloli/approvebypoll-v2:latest
    container_name: approvebypoll-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./conf_dir/settings.toml:/app/conf_dir/settings.toml:ro
      # Must contain: [database] driver = "sqlite"
      - ./conf_dir/.secrets.toml:/app/conf_dir/.secrets.toml:ro
      # Persist the SQLite database outside the container.
      - ./data:/app/data
